groups:
  - name: hdfs_ha_alerts
    interval: 30s
    rules:
      # NameNode Alerts
      - alert: NameNodeDown
        expr: up{job="hdfs_namenode"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "NameNode {{ $labels.instance }} is down"
          description: "NameNode {{ $labels.instance }} has been down for more than 2 minutes"

      - alert: NameNodeHighHeapUsage
        expr: jvm_memory_bytes_used{area="heap", job="hdfs_namenode"} / jvm_memory_bytes_max{area="heap", job="hdfs_namenode"} > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "NameNode {{ $labels.instance }} high heap usage"
          description: "NameNode {{ $labels.instance }} heap usage is above 80%"

      - alert: NameNodeNotActive
        expr: hdfs_namenode_state{state="active"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "No Active NameNode found"
          description: "No NameNode in Active state for more than 5 minutes"

      # JournalNode Alerts
      - alert: JournalNodeDown
        expr: up{job="hdfs_journalnode"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "JournalNode {{ $labels.instance }} is down"
          description: "JournalNode {{ $labels.instance }} has been down for more than 2 minutes"

      - alert: JournalNodeQuorumAtRisk
        expr: count(up{job="hdfs_journalnode"} == 1) < 2
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "JournalNode quorum at risk"
          description: "Less than 2 JournalNodes online - quorum at risk"

      # DataNode Alerts
      - alert: DataNodeDown
        expr: up{job="hdfs_datanode"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "DataNode {{ $labels.instance }} is down"
          description: "DataNode {{ $labels.instance }} has been down for more than 5 minutes"

      - alert: DataNodeHighDiskUsage
        expr: hdfs_datanode_disk_used / hdfs_datanode_disk_capacity > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "DataNode {{ $labels.instance }} high disk usage"
          description: "DataNode {{ $labels.instance }} disk usage is above 85%"

      # ZKFC Alerts
      - alert: ZKFCDown
        expr: up{job="hdfs_zkfc"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "ZKFC {{ $labels.instance }} is down"
          description: "ZKFC {{ $labels.instance }} has been down for more than 2 minutes"

      # HDFS General Alerts
      - alert: HDFSCorruptBlocks
        expr: hdfs_fsck_corrupt_blocks > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Corrupt blocks detected"
          description: "{{ $value }} corrupt blocks detected in HDFS"

      - alert: HDFSUnderReplicatedBlocks
        expr: hdfs_fsck_under_replicated_blocks > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Under-replicated blocks"
          description: "{{ $value }} under-replicated blocks detected"

      - alert: HDFSMissingBlocks
        expr: hdfs_fsck_missing_blocks > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Missing blocks detected"
          description: "{{ $value }} missing blocks detected in HDFS"
