# HDFS Metrics2 Configuration for Prometheus
# This configuration exports HDFS metrics in Prometheus format

# Namenode metrics
namenode.sink.prometheus.class=org.apache.hadoop.metrics2.sink.PrometheusMetricsSink
namenode.sink.prometheus.port=7000
namenode.sink.prometheus.jvm.source=true

# Datanode metrics
datanode.sink.prometheus.class=org.apache.hadoop.metrics2.sink.PrometheusMetricsSink
datanode.sink.prometheus.port=7001
datanode.sink.prometheus.jvm.source=true

# Journalnode metrics
journalnode.sink.prometheus.class=org.apache.hadoop.metrics2.sink.PrometheusMetricsSink
journalnode.sink.prometheus.port=7002
journalnode.sink.prometheus.jvm.source=true

# ZKFC metrics
zkfc.sink.prometheus.class=org.apache.hadoop.metrics2.sink.PrometheusMetricsSink
zkfc.sink.prometheus.port=7003
zkfc.sink.prometheus.jvm.source=true

# File sink for fallback
*.sink.file.class=org.apache.hadoop.metrics2.sink.FileSink
*.sink.file.filename=/opt/hadoop/logs/metrics.log
*.sink.file.period=60
