status = ERROR
name = HadoopLog4j2
packages = org.apache.hadoop.util.log4j

property.hadoop.log.dir = /opt/hadoop/logs
property.hadoop.log.file = hadoop
property.hadoop.security.logger = INFO,console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{ISO8601} %p %c{2}: %m%n

appender.RFA.type = RollingFile
appender.RFA.name = RFA
appender.RFA.fileName = ${sys:hadoop.log.dir}/${sys:hadoop.log.file}.log
appender.RFA.filePattern = ${sys:hadoop.log.dir}/${sys:hadoop.log.file}.log.%d{yyyy-MM-dd}
appender.RFA.layout.type = PatternLayout
appender.RFA.layout.pattern = %d{ISO8601} %p %c{2}: %m%n
appender.RFA.policies.type = Policies
appender.RFA.policies.time.type = TimeBasedTriggeringPolicy
appender.RFA.policies.time.interval = 1
appender.RFA.policies.time.modulate = true
appender.RFA.strategy.type = DefaultRolloverStrategy
appender.RFA.strategy.max = 30

appender.DRFAS.type = RollingFile
appender.DRFAS.name = DRFAS
appender.DRFAS.fileName = ${sys:hadoop.log.dir}/hadoop-${sys:user.name}-drfa-${sys:host.name}.log
appender.DRFAS.filePattern = ${sys:hadoop.log.dir}/hadoop-${sys:user.name}-drfa-${sys:host.name}.log.%d{yyyy-MM-dd}
appender.DRFAS.layout.type = PatternLayout
appender.DRFAS.layout.pattern = %d{ISO8601} %p %c{2}: %m%n
appender.DRFAS.policies.type = Policies
appender.DRFAS.policies.time.type = TimeBasedTriggeringPolicy
appender.DRFAS.policies.time.interval = 1
appender.DRFAS.policies.time.modulate = true

appender.RFAS.type = RollingFile
appender.RFAS.name = RFAS
appender.RFAS.fileName = ${sys:hadoop.log.dir}/${sys:hadoop.log.file}.audit
appender.RFAS.filePattern = ${sys:hadoop.log.dir}/${sys:hadoop.log.file}.audit.%d{yyyy-MM-dd}
appender.RFAS.layout.type = PatternLayout
appender.RFAS.layout.pattern = %d{ISO8601} %p %c{2}: %m%n
appender.RFAS.policies.type = Policies
appender.RFAS.policies.time.type = TimeBasedTriggeringPolicy
appender.RFAS.policies.time.interval = 1
appender.RFAS.policies.time.modulate = true

appender.SecurityAppender.type = RollingFile
appender.SecurityAppender.name = SecurityAppender
appender.SecurityAppender.fileName = ${sys:hadoop.log.dir}/hadoop-security.log
appender.SecurityAppender.filePattern = ${sys:hadoop.log.dir}/hadoop-security.log.%d{yyyy-MM-dd}
appender.SecurityAppender.layout.type = PatternLayout
appender.SecurityAppender.layout.pattern = %d{ISO8601} %p %c{2}: %m%n
appender.SecurityAppender.policies.type = Policies
appender.SecurityAppender.policies.time.type = TimeBasedTriggeringPolicy
appender.SecurityAppender.policies.time.interval = 1
appender.SecurityAppender.policies.time.modulate = true

rootLogger.level = INFO
rootLogger.appenderRef.console.ref = console
rootLogger.appenderRef.RFA.ref = RFA

logger.SecurityLogger.name = SecurityLogger
logger.SecurityLogger.level = ${sys:hadoop.security.logger}
logger.SecurityLogger.appenderRef.SecurityAppender.ref = SecurityAppender
logger.SecurityLogger.additivity = false

logger.org.apache.hadoop.ipc.name = org.apache.hadoop.ipc
logger.org.apache.hadoop.ipc.level = INFO
logger.org.apache.hadoop.hdfs.name = org.apache.hadoop.hdfs
logger.org.apache.hadoop.hdfs.level = INFO
logger.org.apache.hadoop.hdfs.server.namenode.name = org.apache.hadoop.hdfs.server.namenode
logger.org.apache.hadoop.hdfs.server.namenode.level = INFO
logger.org.apache.hadoop.hdfs.server.datanode.name = org.apache.hadoop.hdfs.server.datanode
logger.org.apache.hadoop.hdfs.server.datanode.level = INFO
logger.org.apache.hadoop.hdfs.server.journalnode.name = org.apache.hadoop.hdfs.server.journalnode
logger.org.apache.hadoop.hdfs.server.journalnode.level = INFO
