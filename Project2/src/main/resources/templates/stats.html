<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>统计分析 - 记账系统</title>
    <link rel="stylesheet" href="/css/melody.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            display: flex;
            min-height: 100vh;
            background: #fff0f5;
        }
        .sidebar {
            width: 240px;
            background: linear-gradient(180deg, #ff6b9d 0%, #ff8a80 100%);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
        }
        .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 40px;
            text-align: center;
        }
        .nav-item {
            color: white;
            padding: 15px 20px;
            margin: 5px 0;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s;
            text-decoration: none;
            display: block;
        }
        .nav-item:hover, .nav-item.active {
            background: rgba(255,255,255,0.2);
        }
        .main-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }
        .page-title {
            font-size: 24px;
            color: #333;
            margin-bottom: 30px;
        }
        .toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
            background: white;
            border-radius: 15px;
            padding: 16px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }
        .toolbar select, .toolbar input {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            min-width: 110px;
        }
        .toolbar button {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            background: #ff6b9d;
        }
        .range-label {
            margin-left: auto;
            color: #888;
            font-size: 14px;
        }
        .summary-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }
        .summary-card {
            background: white;
            padding: 22px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }
        .summary-label {
            color: #888;
            font-size: 14px;
            margin-bottom: 8px;
        }
        .summary-value {
            font-size: 24px;
            font-weight: bold;
        }
        .summary-value.income { color: #52c41a; }
        .summary-value.expense { color: #ff4d4f; }
        .summary-value.balance { color: #1890ff; }
        .charts {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .chart-box {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }
        .chart-title {
            font-size: 16px;
            margin-bottom: 15px;
            color: #333;
        }
        .chart-fallback {
            height: 350px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 12px;
            color: #666;
        }
        .fallback-row {
            display: grid;
            grid-template-columns: 70px 1fr 80px;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }
        .fallback-bar {
            height: 12px;
            border-radius: 6px;
            background: #ffd1dc;
            overflow: hidden;
        }
        .fallback-fill {
            height: 100%;
            border-radius: 6px;
            background: #ff6b9d;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">🍓 记账系统</div>
        <a href="/index" class="nav-item">📊 首页</a>
        <a href="/records" class="nav-item">📝 记账记录</a>
        <a href="/accounts" class="nav-item">💳 账户管理</a>
        <a href="/stats" class="nav-item active">📈 统计分析</a>
    </div>

    <div class="main-content">
        <div class="page-title">统计分析</div>
        <div class="toolbar">
            <select id="rangeMode" onchange="onRangeModeChange()">
                <option value="all">全部记录</option>
                <option value="month">本月</option>
                <option value="custom">指定年月</option>
            </select>
            <input type="number" id="yearInput" min="2000" max="2100" style="display:none;">
            <select id="monthInput" style="display:none;">
                <option value="1">1月</option>
                <option value="2">2月</option>
                <option value="3">3月</option>
                <option value="4">4月</option>
                <option value="5">5月</option>
                <option value="6">6月</option>
                <option value="7">7月</option>
                <option value="8">8月</option>
                <option value="9">9月</option>
                <option value="10">10月</option>
                <option value="11">11月</option>
                <option value="12">12月</option>
            </select>
            <button onclick="loadStatistics()">刷新统计</button>
            <span class="range-label" id="rangeLabel">当前：全部记录</span>
        </div>
        <div class="summary-cards">
            <div class="summary-card">
                <div class="summary-label" id="incomeLabel">总收入</div>
                <div class="summary-value income" id="monthIncome">¥0.00</div>
            </div>
            <div class="summary-card">
                <div class="summary-label" id="expenseLabel">总支出</div>
                <div class="summary-value expense" id="monthExpense">¥0.00</div>
            </div>
            <div class="summary-card">
                <div class="summary-label" id="balanceLabel">总结余</div>
                <div class="summary-value balance" id="monthBalance">¥0.00</div>
            </div>
        </div>
        <div class="charts">
            <div class="chart-box">
                <div class="chart-title">支出分类分布</div>
                <div id="expenseChart" style="height: 350px;"></div>
            </div>
            <div class="chart-box">
                <div class="chart-title">收入分类分布</div>
                <div id="incomeChart" style="height: 350px;"></div>
            </div>
        </div>
    </div>

    <script>
        let expenseChart = null;
        let incomeChart = null;

        function getSelectedRange() {
            const mode = document.getElementById('rangeMode').value;
            const now = new Date();
            if (mode === 'month') {
                return {
                    mode,
                    year: now.getFullYear(),
                    month: now.getMonth() + 1,
                    label: '本月'
                };
            }
            if (mode === 'custom') {
                return {
                    mode,
                    year: document.getElementById('yearInput').value,
                    month: document.getElementById('monthInput').value,
                    label: `${document.getElementById('yearInput').value}年${document.getElementById('monthInput').value}月`
                };
            }
            return { mode, year: '', month: '', label: '全部记录' };
        }

        function buildQuery(range) {
            const params = new URLSearchParams();
            if (range.year) {
                params.append('year', range.year);
            }
            if (range.month) {
                params.append('month', range.month);
            }
            const query = params.toString();
            return query ? '?' + query : '';
        }

        function onRangeModeChange() {
            const mode = document.getElementById('rangeMode').value;
            const showCustom = mode === 'custom';
            document.getElementById('yearInput').style.display = showCustom ? 'block' : 'none';
            document.getElementById('monthInput').style.display = showCustom ? 'block' : 'none';
            loadStatistics();
        }

        function initDefaults() {
            const now = new Date();
            document.getElementById('yearInput').value = now.getFullYear();
            document.getElementById('monthInput').value = now.getMonth() + 1;
        }

        function loadStatistics() {
            const range = getSelectedRange();
            const query = buildQuery(range);
            document.getElementById('rangeLabel').textContent = '当前：' + range.label;
            document.getElementById('incomeLabel').textContent = range.mode === 'all' ? '总收入' : range.label + '收入';
            document.getElementById('expenseLabel').textContent = range.mode === 'all' ? '总支出' : range.label + '支出';
            document.getElementById('balanceLabel').textContent = range.mode === 'all' ? '总结余' : range.label + '结余';

            fetch('/api/statistics/summary' + query)
                .then(res => res.json())
                .then(data => {
                    if (data.code === 200) {
                        const d = data.data || {};
                        document.getElementById('monthIncome').textContent = '¥' + (d.totalIncome || 0);
                        document.getElementById('monthExpense').textContent = '¥' + (d.totalExpense || 0);
                        document.getElementById('monthBalance').textContent = '¥' + (d.balance || 0);
                    } else if (data.message === '请先登录') {
                        window.location.href = '/user/login';
                    }
                });

            // 加载支出分类数据
            fetch('/api/statistics/category/expense' + query)
                .then(res => res.json())
                .then(data => {
                    if (data.code === 200) {
                        renderExpenseChart(data.data || []);
                    }
                });

            // 加载收入分类数据
            fetch('/api/statistics/category/income' + query)
                .then(res => res.json())
                .then(data => {
                    if (data.code === 200) {
                        renderIncomeChart(data.data || []);
                    }
                });
        }

        function renderExpenseChart(data) {
            const chartData = data.map(item => ({
                name: item.category || item.categoryName || '其他',
                value: Number(item.totalAmount || item.amount || item.value || 0)
            }));

            const chartEl = document.getElementById('expenseChart');
            if (typeof echarts === 'undefined') {
                renderFallbackRows(chartEl, chartData);
                return;
            }
            if (expenseChart) {
                expenseChart.dispose();
            }
            expenseChart = echarts.init(chartEl);
            expenseChart.setOption({
                tooltip: { trigger: 'item' },
                series: [{
                    type: 'pie',
                    radius: '60%',
                    data: chartData.length > 0 ? chartData : [
                        { name: '暂无数据', value: 0 }
                    ]
                }]
            });

        }

        function renderIncomeChart(data) {
            const chartData = data.map(item => ({
                name: item.category || item.categoryName || '其他',
                value: Number(item.totalAmount || item.amount || item.value || 0)
            }));

            const chartEl = document.getElementById('incomeChart');
            if (typeof echarts === 'undefined') {
                renderFallbackRows(chartEl, chartData);
                return;
            }
            if (incomeChart) {
                incomeChart.dispose();
            }
            incomeChart = echarts.init(chartEl);
            incomeChart.setOption({
                tooltip: { trigger: 'item' },
                series: [{
                    type: 'pie',
                    radius: '60%',
                    data: chartData.length > 0 ? chartData : [
                        { name: '暂无数据', value: 0 }
                    ]
                }]
            });

        }

        function renderFallbackRows(container, data) {
            const rows = data && data.length > 0 ? data : [{ name: '暂无数据', value: 0 }];
            const max = Math.max(...rows.map(item => Number(item.value || 0)), 1);
            container.innerHTML = `<div class="chart-fallback">${rows.map(item => {
                const value = Number(item.value || 0);
                const width = Math.max(value / max * 100, value > 0 ? 8 : 0);
                return `<div class="fallback-row">
                    <span>${item.name}</span>
                    <div class="fallback-bar"><div class="fallback-fill" style="width:${width}%"></div></div>
                    <span>¥${value}</span>
                </div>`;
            }).join('')}</div>`;
        }

        initDefaults();
        loadStatistics();
        window.addEventListener('resize', () => {
            if (expenseChart) {
                expenseChart.resize();
            }
            if (incomeChart) {
                incomeChart.resize();
            }
        });
    </script>
</body>
</html>
