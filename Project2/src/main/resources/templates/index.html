<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>首页 - 记账系统</title>
    <link rel="stylesheet" href="/css/melody.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            display: flex;
            min-height: 100vh;
            background: #fff0f5;
        }
        .sidebar {
            width: 240px;
            background: linear-gradient(180deg, #ff6b9d 0%, #ff8a80 100%);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
        }
        .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 40px;
            text-align: center;
        }
        .nav-item {
            color: white;
            padding: 15px 20px;
            margin: 5px 0;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s;
            text-decoration: none;
            display: block;
        }
        .nav-item:hover, .nav-item.active {
            background: rgba(255,255,255,0.2);
        }
        .main-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .welcome {
            font-size: 24px;
            color: #333;
        }
        .logout-btn {
            padding: 10px 20px;
            background: #ff6b9d;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .stats-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }
        .card-title {
            color: #888;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .card-value {
            font-size: 28px;
            font-weight: bold;
        }
        .card-value.income { color: #52c41a; }
        .card-value.expense { color: #ff4d4f; }
        .card-value.balance { color: #1890ff; }
        .charts {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .chart-box {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }
        .chart-title {
            font-size: 16px;
            margin-bottom: 15px;
            color: #333;
        }
        .chart-fallback {
            height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 10px;
            color: #666;
        }
        .fallback-row {
            display: grid;
            grid-template-columns: 60px 1fr 80px;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }
        .fallback-bar {
            height: 12px;
            border-radius: 6px;
            background: #ffd1dc;
            overflow: hidden;
        }
        .fallback-fill {
            height: 100%;
            border-radius: 6px;
            background: #ff6b9d;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">🍓 记账系统</div>
        <a href="/index" class="nav-item active">📊 首页</a>
        <a href="/records" class="nav-item">📝 记账记录</a>
        <a href="/accounts" class="nav-item">💳 账户管理</a>
        <a href="/stats" class="nav-item">📈 统计分析</a>
    </div>

    <div class="main-content">
        <div class="header">
            <div class="welcome">欢迎回来！</div>
            <button class="logout-btn" onclick="logout()">退出登录</button>
        </div>

        <div class="stats-cards">
            <div class="card">
                <div class="card-title">总收入</div>
                <div class="card-value income" id="totalIncome">¥0.00</div>
            </div>
            <div class="card">
                <div class="card-title">总支出</div>
                <div class="card-value expense" id="totalExpense">¥0.00</div>
            </div>
            <div class="card">
                <div class="card-title">账户余额</div>
                <div class="card-value balance" id="totalBalance">¥0.00</div>
            </div>
        </div>

        <div class="charts">
            <div class="chart-box">
                <div class="chart-title">收支趋势</div>
                <div id="trendChart" style="height: 300px;"></div>
            </div>
            <div class="chart-box">
                <div class="chart-title">支出分类</div>
                <div id="categoryChart" style="height: 300px;"></div>
            </div>
        </div>
    </div>

    <script>
        function logout() {
            window.location.href = '/user/logout';
        }

        function loadDashboard() {
            fetch('/api/statistics/dashboard')
                .then(res => res.json())
                .then(data => {
                    if (data.code === 200) {
                        const d = data.data;
                        document.getElementById('totalIncome').textContent = '¥' + (d.monthlyIncome || 0);
                        document.getElementById('totalExpense').textContent = '¥' + (d.monthlyExpense || 0);
                        document.getElementById('totalBalance').textContent = '¥' + (d.totalBalance || 0);
                    } else if (data.message === '请先登录') {
                        window.location.href = '/user/login';
                    }
                });

            fetch('/api/statistics/category/expense')
                .then(res => res.json())
                .then(data => {
                    if (data.code === 200) {
                        initCategoryChart(data.data);
                    }
                });

            fetch('/api/statistics/trend')
                .then(res => res.json())
                .then(data => {
                    if (data.code === 200) {
                        initTrendChart(data.data || []);
                    }
                });
        }

        function initTrendChart(data) {
            const chartEl = document.getElementById('trendChart');
            const months = Array.from({ length: 12 }, (_, i) => `${i + 1}月`);
            const income = Array(12).fill(0);
            const expense = Array(12).fill(0);
            (data || []).forEach(item => {
                const month = Number(item.recordMonth || item.month);
                if (month >= 1 && month <= 12) {
                    income[month - 1] = Number(item.totalIncome || 0);
                    expense[month - 1] = Number(item.totalExpense || 0);
                }
            });
            if (typeof echarts === 'undefined') {
                renderFallbackRows(chartEl, months.map((m, i) => ({
                    name: m,
                    value: income[i] + expense[i]
                })).filter(item => item.value > 0));
                return;
            }
            const chart = echarts.init(chartEl);
            chart.setOption({
                tooltip: { trigger: 'axis' },
                legend: { data: ['收入', '支出'] },
                xAxis: { type: 'category', data: months },
                yAxis: { type: 'value' },
                series: [
                    { name: '收入', type: 'line', smooth: true, data: income, color: '#52c41a' },
                    { name: '支出', type: 'line', smooth: true, data: expense, color: '#ff4d4f' }
                ]
            });
        }

        function initCategoryChart(data) {
            const chartEl = document.getElementById('categoryChart');
            const chartData = data ? data.map(item => ({
                name: item.categoryName || item.category || '其他',
                value: Number(item.totalAmount || item.amount || 0)
            })) : [];
            if (typeof echarts === 'undefined') {
                renderFallbackRows(chartEl, chartData);
                return;
            }
            const chart = echarts.init(chartEl);
            chart.setOption({
                tooltip: { trigger: 'item' },
                series: [{
                    type: 'pie',
                    radius: '60%',
                    data: chartData.length > 0 ? chartData : [{ name: '暂无数据', value: 0 }],
                    emphasis: { itemStyle: { shadowBlur: 10, shadowOffsetX: 0, shadowColor: 'rgba(0, 0, 0, 0.5)' } }
                }]
            });
        }

        function renderFallbackRows(container, data) {
            const rows = data && data.length > 0 ? data : [{ name: '暂无数据', value: 0 }];
            const max = Math.max(...rows.map(item => Number(item.value || 0)), 1);
            container.innerHTML = `<div class="chart-fallback">${rows.map(item => {
                const value = Number(item.value || 0);
                const width = Math.max(value / max * 100, value > 0 ? 8 : 0);
                return `<div class="fallback-row">
                    <span>${item.name}</span>
                    <div class="fallback-bar"><div class="fallback-fill" style="width:${width}%"></div></div>
                    <span>¥${value}</span>
                </div>`;
            }).join('')}</div>`;
        }

        loadDashboard();
        window.addEventListener('resize', () => {
            if (typeof echarts === 'undefined') {
                return;
            }
            const trendChart = echarts.getInstanceByDom(document.getElementById('trendChart'));
            const categoryChart = echarts.getInstanceByDom(document.getElementById('categoryChart'));
            if (trendChart) {
                trendChart.resize();
            }
            if (categoryChart) {
                categoryChart.resize();
            }
        });
    </script>
</body>
</html>
