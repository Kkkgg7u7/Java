<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>首页 - 记账系统</title>
    <link rel="stylesheet" href="/css/melody.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            display: flex;
            min-height: 100vh;
            background: #fff0f5;
        }
        .sidebar {
            width: 240px;
            background: linear-gradient(180deg, #ff6b9d 0%, #ff8a80 100%);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
        }
        .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 40px;
            text-align: center;
        }
        .nav-item {
            color: white;
            padding: 15px 20px;
            margin: 5px 0;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s;
            text-decoration: none;
            display: block;
        }
        .nav-item:hover, .nav-item.active {
            background: rgba(255,255,255,0.2);
        }
        .main-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .welcome {
            font-size: 24px;
            color: #333;
        }
        .logout-btn {
            padding: 10px 20px;
            background: #ff6b9d;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .stats-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }
        .card-title {
            color: #888;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .card-value {
            font-size: 28px;
            font-weight: bold;
        }
        .card-value.income { color: #52c41a; }
        .card-value.expense { color: #ff4d4f; }
        .card-value.balance { color: #1890ff; }
        .charts {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .chart-box {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }
        .chart-title {
            font-size: 16px;
            margin-bottom: 15px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">🍓 记账系统</div>
        <a href="/index" class="nav-item active">📊 首页</a>
        <a href="/records" class="nav-item">📝 记账记录</a>
        <a href="/accounts" class="nav-item">💳 账户管理</a>
        <a href="/stats" class="nav-item">📈 统计分析</a>
    </div>

    <div class="main-content">
        <div class="header">
            <div class="welcome">欢迎回来！</div>
            <button class="logout-btn" onclick="logout()">退出登录</button>
        </div>

        <div class="stats-cards">
            <div class="card">
                <div class="card-title">总收入</div>
                <div class="card-value income" id="totalIncome">¥0.00</div>
            </div>
            <div class="card">
                <div class="card-title">总支出</div>
                <div class="card-value expense" id="totalExpense">¥0.00</div>
            </div>
            <div class="card">
                <div class="card-title">账户余额</div>
                <div class="card-value balance" id="totalBalance">¥0.00</div>
            </div>
        </div>

        <div class="charts">
            <div class="chart-box">
                <div class="chart-title">收支趋势</div>
                <div id="trendChart" style="height: 300px;"></div>
            </div>
            <div class="chart-box">
                <div class="chart-title">支出分类</div>
                <div id="categoryChart" style="height: 300px;"></div>
            </div>
        </div>
    </div>

    <script>
        function logout() {
            window.location.href = '/user/logout';
        }

        function loadDashboard() {
            fetch('/api/statistics/dashboard')
                .then(res => res.json())
                .then(data => {
                    if (data.code === 200) {
                        const d = data.data;
                        document.getElementById('totalIncome').textContent = '¥' + (d.monthlyIncome || 0);
                        document.getElementById('totalExpense').textContent = '¥' + (d.monthlyExpense || 0);
                        document.getElementById('totalBalance').textContent = '¥' + (d.totalBalance || 0);
                    }
                });

            fetch('/api/statistics/category/expense')
                .then(res => res.json())
                .then(data => {
                    if (data.code === 200) {
                        initCategoryChart(data.data);
                    }
                });

            initTrendChart();
        }

        function initTrendChart() {
            const chart = echarts.init(document.getElementById('trendChart'));
            chart.setOption({
                tooltip: { trigger: 'axis' },
                legend: { data: ['收入', '支出'] },
                xAxis: { type: 'category', data: ['1月', '2月', '3月', '4月', '5月', '6月'] },
                yAxis: { type: 'value' },
                series: [
                    { name: '收入', type: 'line', smooth: true, data: [8000, 9000, 8500, 9200, 8800, 9500], color: '#52c41a' },
                    { name: '支出', type: 'line', smooth: true, data: [4000, 4500, 4200, 4800, 4600, 5000], color: '#ff4d4f' }
                ]
            });
        }

        function initCategoryChart(data) {
            const chart = echarts.init(document.getElementById('categoryChart'));
            const chartData = data ? data.map(item => ({ name: item.categoryName || item.category, value: item.totalAmount || item.amount })) : [
                { name: '餐饮', value: 1500 },
                { name: '交通', value: 500 },
                { name: '购物', value: 1000 },
                { name: '娱乐', value: 600 },
                { name: '其他', value: 400 }
            ];
            chart.setOption({
                tooltip: { trigger: 'item' },
                series: [{
                    type: 'pie',
                    radius: '60%',
                    data: chartData,
                    emphasis: { itemStyle: { shadowBlur: 10, shadowOffsetX: 0, shadowColor: 'rgba(0, 0, 0, 0.5)' } }
                }]
            });
        }

        loadDashboard();
        window.addEventListener('resize', () => {
            echarts.getInstanceByDom(document.getElementById('trendChart')).resize();
            echarts.getInstanceByDom(document.getElementById('categoryChart')).resize();
        });
    </script>
</body>
</html>
