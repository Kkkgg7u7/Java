spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/account_book?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root

  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql

hadoop:
  hdfs:
    default-uri: ${HADOOP_DEFAULT_FS:hdfs://mycluster}
    config-location: ${HADOOP_CONF_DIR:../hdfs-ha-config/etc/hadoop}
    test-dir: ${HADOOP_TEST_DIR:/account-book/performance}
