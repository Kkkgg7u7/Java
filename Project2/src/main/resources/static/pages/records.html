<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" href="css/melody.css">
    <meta charset="UTF-8">
    <title>My Melody 记账空间 - 记账记录</title>
    <style>
        /* 针对记录页面的专属样式 */
        .action-btn {
            border: none;
            background: none;
            cursor: pointer;
            font-size: 18px;
            padding: 5px 10px;
            transition: 0.3s;
            border-radius: 10px;
        }
        .edit-btn:hover { background-color: var(--melody-light); color: var(--melody-dark); }
        .delete-btn:hover { background-color: #ffe0e0; color: var(--accent-red); }

        /* 状态标签样式 */
        .tag {
            padding: 4px 10px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: bold;
        }
        .tag-out { background-color: var(--melody-light); color: var(--accent-red); }
        .tag-in { background-color: #e6ffed; color: #6AB04C; }

        /* 月份选择器高度优化 */
        .custom-options {
            max-height: 250px;
            overflow-y: auto;
        }
        /* 自定义滚动条样式 */
        .custom-options::-webkit-scrollbar { width: 6px; }
        .custom-options::-webkit-scrollbar-thumb { background: var(--melody-pink); border-radius: 10px; }
    </style>
</head>
<body>

    <!-- 侧边栏 (保持原样) -->
    <div class="sidebar">
        <a href="index.html" class="sidebar-logo" style="text-decoration:none;">🍓 Melody Book</a>
        <a href="records.html" class="nav-item"><i>🌸</i> 记账记录</a>
        <a href="accounts.html" class="nav-item"><i>🎀</i> 账户管理</a>
        <a href="stats.html" class="nav-item"><i>🍭</i> 统计分析</a>
        <div style="margin-top: auto; text-align: center; color: var(--melody-pink); font-size: 12px;"><p>Melody Style v2.1 ♥</p></div>
    </div>

    <!-- 主内容 -->
    <div class="main-content">
        <div class="filter-bar" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h2 style="color: var(--melody-dark); margin: 0;">🌸 历史账单</h2>
            
            <!-- 优化后的月份选择器 -->
            <div style="display: flex; align-items: center; gap: 15px;">
                <span style="font-size: 14px; font-weight: bold; color: var(--berry-brown);">筛选月份:</span>
                <div class="custom-select-wrapper" style="width: 220px;">
                    <div class="custom-select-trigger">📅 2023年10月</div>
                    <div class="custom-options">
                        <div class="custom-option">📅 2023年10月</div>
                        <div class="custom-option">📅 2023年09月</div>
                        <div class="custom-option">📅 2023年08月</div>
                        <div class="custom-option">📅 2023年07月</div>
                        <div class="custom-option">📅 2023年06月</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 账单列表 -->
        <div class="record-list-container">
            <table>
                <thead>
                    <tr>
                        <th style="padding-left: 20px;">日期</th>
                        <th>类型</th>
                        <th>分类</th>
                        <th>备注</th>
                        <th>支付方式</th>
                        <th style="text-align: right;">金额</th>
                        <th style="text-align: center;">操作</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- 每一笔记录 -->
                    <tr>
                        <td style="padding-left: 20px;">2023-10-25</td>
                        <td><span class="tag tag-out">支出</span></td>
                        <td><span class="category-icon">🍰</span> 饮食</td>
                        <td style="color: #999;">下午茶草莓拿铁</td>
                        <td>微信支付</td>
                        <td style="text-align: right;" class="amount-text type-out">-18.00</td>
                        <td style="text-align: center;">
                            <button class="action-btn edit-btn" title="编辑" onclick="...">📝</button>
                            <button class="action-btn delete-btn" title="删除" onclick="...">🗑️</button>
                        </td>
                    </tr>
                    <!-- 更多条目... -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- 🍎 修改记录的弹窗 (Modal) -->
    <div class="modal-overlay" id="editModalOverlay">
        <div class="modal-card" style="width: 600px; max-width: 90%; text-align: left;">
            <h3 style="color: var(--melody-dark); text-align: center; margin-bottom: 25px;">修改记账记录 🍓</h3>
            <form id="editForm">
                <div class="record-grid">
                    <div class="form-group">
                        <label>收支类型</label>
                        <div class="custom-select-wrapper">
                            <div class="custom-select-trigger" id="editType">支出 (-)</div>
                            <div class="custom-options">
                                <div class="custom-option">支出 (-)</div>
                                <div class="custom-option">收入 (+)</div>
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>金额</label>
                        <input type="number" id="editAmount" class="pretty-input" step="0.01">
                    </div>
                    <div class="form-group">
                        <label>分类</label>
                        <div class="custom-select-wrapper">
                            <div class="custom-select-trigger" id="editCategory">🍰 饮食</div>
                            <div class="custom-options">
                                <div class="custom-option">🍰 饮食</div>
                                <div class="custom-option">👗 服饰</div>
                                <div class="custom-option">🍭 娱乐</div>
                                <div class="custom-option">🚇 交通</div>
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>日期</label>
                        <input type="date" id="editDate" class="pretty-input">
                    </div>
                    <div class="form-group" style="grid-column: span 2;">
                        <label>备注</label>
                        <input type="text" id="editRemark" class="pretty-input">
                    </div>
                </div>
                <div style="text-align: center; margin-top: 30px;">
                    <button type="button" class="save-btn" onclick="saveEdit()">保存修改</button>
                    <button type="button" class="cancel-btn" onclick="closeEditModal()">取消</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // 1. 自定义下拉逻辑 (月份选择 + 弹窗内选择)
        function initSelects() {
            document.querySelectorAll('.custom-select-wrapper').forEach(wrapper => {
                wrapper.onclick = function(e) {
                    e.stopPropagation();
                    document.querySelectorAll('.custom-select-wrapper').forEach(w => {
                        if (w !== this) w.classList.remove('open');
                    });
                    this.classList.toggle('open');
                };
                
                wrapper.querySelectorAll('.custom-option').forEach(option => {
                    option.onclick = function(e) {
                        e.stopPropagation();
                        wrapper.querySelector('.custom-select-trigger').innerText = this.innerText;
                        wrapper.classList.remove('open');
                    };
                });
            });
        }
        initSelects();

        window.onclick = () => {
            document.querySelectorAll('.custom-select-wrapper').forEach(w => w.classList.remove('open'));
        };

        // 2. 修改弹窗逻辑
        const editModal = document.getElementById('editModalOverlay');
        const modalCard = editModal.querySelector('.modal-card');

        function openEditModal(date, type, amount, category, remark) {
            // 将当前行的数据填充到表单里
            document.getElementById('editDate').value = date;
            document.getElementById('editType').innerText = type.includes('支出') ? '支出 (-)' : '收入 (+)';
            document.getElementById('editAmount').value = amount;
            document.getElementById('editCategory').innerText = category;
            document.getElementById('editRemark').value = remark;

            // 显示弹窗
            editModal.style.display = 'flex';
            setTimeout(() => modalCard.classList.add('show'), 10);
        }

        function closeEditModal() {
            modalCard.classList.remove('show');
            setTimeout(() => editModal.style.display = 'none', 300);
        }

        function saveEdit() {
            // 这里以后对接 5号的 JS 联调
            alert("修改成功！(这里将触发后端保存接口)");
            closeEditModal();
        }

        function confirmDelete() {
            if(confirm("真的要删除这笔可爱的记录吗？QAQ")) {
                alert("已删除！");
            }
        }
    </script>
</body>
</html>
