<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" href="css/melody.css">
    <!-- 在 head 中引入 Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <meta charset="UTF-8">
    <title>My Melody 记账空间 - 统计分析</title>
</head>
<body>

    <!-- 侧边栏 -->
    <div class="sidebar">
        <a href="index.html" class="sidebar-logo" style="text-decoration:none;">🍓 Melody Book</a>
        <a href="records.html" class="nav-item"><i>🌸</i> 记账记录</a>
        <a href="accounts.html" class="nav-item"><i>🎀</i> 账户管理</a>
        <a href="stats.html" class="nav-item"><i>🍭</i> 统计分析</a>
        <div style="margin-top: auto; text-align: center; color: var(--melody-pink); font-size: 12px;"><p>Melody Style v2.1 ♥</p></div>
    </div>

    <!-- 主内容 -->
    <div class="main-content">
        <div class="filter-bar" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h2 style="color: var(--melody-dark);">🍭 消费分析</h2>
            <div class="custom-select-wrapper" style="width: 200px;">
                <div class="custom-select-trigger">全年统计</div>
                <div class="custom-options">
                    <div class="custom-option">全年统计</div>
                    <div class="custom-option">10月统计</div>
                </div>
            </div>
        </div>

        <div style="display: flex; background: white; border-radius: 40px; padding: 40px; border: 4px solid var(--melody-pink); align-items: center;">
            <!-- 饼状图容器 -->
            <div style="width: 300px; height: 300px;">
                <canvas id="myChart"></canvas>
            </div>

            <!-- 自定义图例 -->
            <div class="legend-area" style="margin-left: 60px; flex: 1;">
                <h3 style="margin-bottom: 20px;">分类占比 🍓</h3>
                <div id="customLegend" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <!-- 图例条目通过脚本渲染或手动列出 -->
                    <div style="display:flex; align-items:center;"><span style="width:12px; height:12px; background:#FFB7C5; border-radius:50%; margin-right:10px;"></span> 饮食: 40%</div>
                    <div style="display:flex; align-items:center;"><span style="width:12px; height:12px; background:#FF85A2; border-radius:50%; margin-right:10px;"></span> 服饰: 25%</div>
                    <div style="display:flex; align-items:center;"><span style="width:12px; height:12px; background:#FF4D6D; border-radius:50%; margin-right:10px;"></span> 交通: 15%</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 自定义下拉逻辑 (修复了与其他点击冲突的问题)
        document.querySelectorAll('.custom-select-wrapper').forEach(wrapper => {
            wrapper.addEventListener('click', function(e) {
                e.stopPropagation();
                document.querySelectorAll('.custom-select-wrapper').forEach(w => {
                    if (w !== this) w.classList.remove('open');
                });
                this.classList.toggle('open');
            });
            wrapper.querySelectorAll('.custom-option').forEach(option => {
                option.addEventListener('click', function(e) {
                    e.stopPropagation();
                    wrapper.querySelector('.custom-select-trigger').innerText = this.innerText;
                    wrapper.classList.remove('open');
                });
            });
        });
        window.addEventListener('click', () => {
            document.querySelectorAll('.custom-select-wrapper').forEach(w => w.classList.remove('open'));
        });

        // 初始化饼状图
        const ctx = document.getElementById('myChart').getContext('2d');
        new Chart(ctx, {
            type: 'pie',
            data: {
                labels: ['饮食', '服饰', '交通', '娱乐', '生活'],
                datasets: [{
                    data: [40, 25, 15, 10, 10],
                    backgroundColor: ['#FFB7C5', '#FF85A2', '#FF4D6D', '#FFF0F3', '#FFC3A0'],
                    borderWidth: 2,
                    borderColor: '#ffffff'
                }]
            },
            options: {
                plugins: { legend: { display: false } } // 隐藏默认图例，使用我们美化过的
            }
        });
    </script>
