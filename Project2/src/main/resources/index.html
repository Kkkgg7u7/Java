<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Melody 记账空间 - 主页</title>
    <!-- 引入外部样式 -->
    <link rel="stylesheet" href="css/melody.css">
    <style>
        /* 针对页面布局的微调，确保侧边栏与内容区并排 */
        body {
            display: flex;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            background-color: var(--melody-light);
        }

        /* 强制保留你提供的“糟糕”但独特的侧边栏样式 */
        .sidebar {
            width: 250px;
            flex-shrink: 0;
            background-color: #ffb9c8;
            padding: 40px 20px 40px 0;
            display: flex;
            flex-direction: column;
            border-right: 4px solid var(--melody-pink);
            z-index: 10;
        }

        /* 主内容区优化：使其在侧边栏右侧正确平铺 */
        .main-content {
            flex: 1;
            padding: 40px 60px; /* 增加边距，更有呼吸感 */
            overflow-y: auto;
            background-image: radial-gradient(var(--melody-pink) 1px, transparent 0);
            background-size: 30px 30px;
        }

        /* 余额面板优化：PC端横向等分 */
        .balance-dashboard {
            background: white;
            border-radius: 40px;
            padding: 35px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 10px 30px var(--shadow);
            border: 4px solid var(--melody-pink);
            margin-bottom: 40px;
            position: relative;
        }
        
        /* 保持你的 SVG 样式 */
        .eye-btn svg { width: 22px; height: 22px; vertical-align: middle; cursor: pointer; }

        /* 记账区盒子优化 */
        .action-box {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 40px;
            border: 3px dashed var(--melody-pink);
            padding: 60px;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .action-box.active-state {
            background: #FFF;
            border: 3px solid var(--melody-dark);
            border-style: solid;
            box-shadow: 0 20px 50px var(--shadow);
        }

        /* 表单网格：PC端固定三列 */
        .record-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            margin-bottom: 40px;
            width: 100%;
            max-width: 900px;
        }
    </style>
</head>
<body>

    <!-- 完全保留你提供的侧边栏结构 -->
    <div class="sidebar">
        <a href="index.html" class="sidebar-logo" style="text-decoration:none;">🍓 Melody Book</a>
        <a href="records.html" class="nav-item"><i>🌸</i> 记账记录</a>
        <a href="accounts.html" class="nav-item"><i>🎀</i> 账户管理</a>
        <a href="stats.html" class="nav-item"><i>🍭</i> 统计分析</a>
        <div style="margin-top: auto; text-align: center; color: var(--melody-pink); font-size: 12px;"><p>Melody Style v2.1 ♥</p></div>
    </div>

    <!-- 优化后的主内容区 -->
    <div class="main-content">
        <!-- 余额面板 -->
        <div class="balance-dashboard">
            <div class="balance-item" style="text-align: center;">
                <span style="color: #999; font-size: 14px;">小金库 
                    <i class="eye-btn" id="eyeBtn">
                        <svg id="eye-closed" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24M1 1l22 22" /></svg>
                        <svg id="eye-open" style="display:none" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
                    </i>
                </span>
                <h2 id="totalVal" style="font-size: 36px; margin: 10px 0 0 0; color: var(--melody-dark);">******</h2>
            </div>
            <div class="balance-item" style="text-align: center;">
                <span style="color: #999; font-size: 14px;">今日收入</span>
                <h2 id="incomeVal" style="font-size: 32px; margin: 10px 0 0 0; color: #6AB04C;">******</h2>
            </div>
            <div class="balance-item" style="text-align: center;">
                <span style="color: #999; font-size: 14px;">今日支出</span>
                <h2 id="expenseVal" style="font-size: 32px; margin: 10px 0 0 0; color: var(--accent-red);">******</h2>
            </div>
        </div>

        <div style="text-align: center; margin: 40px 0; font-size: 30px; color: var(--melody-dark); font-weight: bold;">
            Hello! <strong th:text="${username}">主人</strong>，欢迎来到 Melody Book！
        </div>

        <!-- 记账交互区 -->
        <div class="action-box" id="actionBox">
            <button class="start-btn" id="startBtn">点我记一笔 🍓</button>

            <!-- 升起的表单 -->
            <div class="form-container" id="formContainer">
                <form id="recordForm">
                    <div class="record-grid">
                        <div class="form-group">
                            <label>收支类型</label>
                            <div class="custom-select-wrapper">
                                <div class="custom-select-trigger">请选择</div>
                                <div class="custom-options">
                                    <div class="custom-option">支出 (-)</div>
                                    <div class="custom-option">收入 (+)</div>
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>金额</label>
                            <input type="number" step="0.01" class="pretty-input" placeholder="0.00">
                        </div>
                        <div class="form-group">
                            <label>消费分类</label>
                            <div class="custom-select-wrapper">
                                <div class="custom-select-trigger">请选择</div>
                                <div class="custom-options">
                                    <div class="custom-option">🍰 饮食</div>
                                    <div class="custom-option">👗 服饰</div>
                                    <div class="custom-option">🍭 娱乐</div>
                                    <div class="custom-option">🚇 交通</div>
                                    <div class="custom-option">🎁 赠礼</div>
                                    <div class="custom-option">🏠 生活</div>
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>支付方式</label>
                            <div class="custom-select-wrapper">
                                <div class="custom-select-trigger">微信支付</div>
                                <div class="custom-options">
                                    <div class="custom-option">微信支付</div>
                                    <div class="custom-option">支付宝</div>
                                    <div class="custom-option">现金</div>
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>日期</label>
                            <input type="date" class="pretty-input" id="dateInput">
                        </div>
                        <div class="form-group">
                            <label>备注</label>
                            <input type="text" class="pretty-input" placeholder="记录当下的心情...">
                        </div>
                    </div>
                    <div style="text-align: center;">
                        <button type="button" class="save-btn" id="saveBtn">确认存入账本</button><br>
                        <button type="button" class="cancel-btn" id="cancelBtn">先取消吧</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 弹窗 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-card" id="modalCard">
            <div style="font-size: 50px;">🍓</div>
            <h3>保存成功啦！</h3>
            <p>今天也是元气满满的一天~</p>
            <button class="close-modal-btn" id="closeModal">好哒</button>
        </div>
    </div>

    <script>
        // 1. 自定义下拉逻辑
        document.querySelectorAll('.custom-select-wrapper').forEach(wrapper => {
            wrapper.addEventListener('click', function(e) {
                e.stopPropagation();
                document.querySelectorAll('.custom-select-wrapper').forEach(w => {
                    if (w !== this) w.classList.remove('open');
                });
                this.classList.toggle('open');
            });
            wrapper.querySelectorAll('.custom-option').forEach(option => {
                option.addEventListener('click', function(e) {
                    e.stopPropagation();
                    wrapper.querySelector('.custom-select-trigger').innerText = this.innerText;
                    wrapper.classList.remove('open');
                });
            });
        });
        window.addEventListener('click', () => {
            document.querySelectorAll('.custom-select-wrapper').forEach(w => w.classList.remove('open'));
        });

        // 2. 余额显示隐藏
        const eyeBtn = document.getElementById('eyeBtn');
        const eyeOpen = document.getElementById('eye-open');
        const eyeClosed = document.getElementById('eye-closed');
        let isHidden = true;
        eyeBtn.onclick = () => {
            isHidden = !isHidden;
            document.getElementById('totalVal').innerText = isHidden ? "******" : "￥8,888.00";
            document.getElementById('incomeVal').innerText = isHidden ? "******" : "￥200.00";
            document.getElementById('expenseVal').innerText = isHidden ? "******" : "￥52.00";
            eyeOpen.style.display = isHidden ? "none" : "block";
            eyeClosed.style.display = isHidden ? "block" : "none";
        };

        // 3. 动画逻辑：按钮消失 -> 表单升起
        const startBtn = document.getElementById('startBtn');
        const formContainer = document.getElementById('formContainer');
        const actionBox = document.getElementById('actionBox');
        const cancelBtn = document.getElementById('cancelBtn');

        startBtn.onclick = () => {
            startBtn.classList.add('btn-hide');
            setTimeout(() => {
                startBtn.style.display = 'none';
                actionBox.classList.add('active-state');
                formContainer.style.display = 'block';
                setTimeout(() => formContainer.classList.add('form-rise-up'), 50);
            }, 400);
        };

        cancelBtn.onclick = () => {
            formContainer.classList.remove('form-rise-up');
            actionBox.classList.remove('active-state');
            setTimeout(() => {
                formContainer.style.display = 'none';
                startBtn.style.display = 'block';
                setTimeout(() => startBtn.classList.remove('btn-hide'), 50);
            }, 600);
        };

        // 4. 弹窗
        const saveBtn = document.getElementById('saveBtn');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalCard = document.getElementById('modalCard');
        saveBtn.onclick = () => {
            modalOverlay.style.display = 'flex';
            setTimeout(() => modalCard.classList.add('show'), 10);
        };
        document.getElementById('closeModal').onclick = () => {
            modalCard.classList.remove('show');
            setTimeout(() => {
                modalOverlay.style.display = 'none';
                cancelBtn.click();
            }, 300);
        };

        window.onload = () => { document.getElementById('dateInput').value = new Date().toISOString().split('T')[0]; };
    </script>
</body>
</html>
