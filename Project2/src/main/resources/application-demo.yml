spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/account_book;MODE=MySQL;DATABASE_TO_UPPER=false;NON_KEYWORDS=USER,RECORD
    username: sa
    password:

  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-h2.sql
      data-locations: classpath:db/data-h2.sql
      continue-on-error: false

  jpa:
    hibernate:
      ddl-auto: none

  h2:
    console:
      enabled: true
      path: /h2-console

hadoop:
  hdfs:
    default-uri: ${HADOOP_DEFAULT_FS:file:///}
    test-dir: ${HADOOP_TEST_DIR:./data/performance}
